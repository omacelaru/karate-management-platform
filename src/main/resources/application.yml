spring:
  application:
    name: karate-management-platform

  # Server Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/karate_users_db
    username: karate_user
    password: Karate.user2025
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: karate.platform@gmail.com
    password: Karate.platform2025
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Swagger Configuration
springdoc:
  api-docs.enabled: true
  swagger-ui.enabled: true

# JWT Configuration
jwt:
  secret-signing-key: 
  access-token-expiration: 900000 # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds

# Domain Configuration
domain:
  url: http://localhost:8080

# Frontend Configuration
frontend:
  url: http://localhost:5173

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
