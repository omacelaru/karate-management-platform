input {
  tcp {
    port => 5044
    codec => json_lines
    type => "spring-boot"
  }
}

filter {
  if [type] == "spring-boot" {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }

    # Adăugăm câmpuri pentru analiză
    mutate {
      add_field => {
        "environment" => "%{[environment]}"
        "version" => "%{[version]}"
        "host_name" => "%{[hostName]}"
      }
    }

    # Procesăm stacktrace-ul pentru a-l face căutabil
    if [stackTrace] {
      mutate {
        replace => { "stackTrace" => "%{[stackTrace]}" }
      }
    }

    # Adăugăm informații despre request
    if [requestUri] {
      mutate {
        add_field => {
          "request_info" => "%{[requestMethod]} %{[requestUri]}"
          "client_info" => "%{[clientIp]} - %{[userAgent]}"
        }
      }
    }

    # Procesăm timpul de răspuns
    if [responseTime] {
      mutate {
        convert => { "responseTime" => "float" }
      }
    }

    # Adăugăm un câmp pentru a identifica sursa logului
    mutate {
      add_field => { "source" => "karate-management-platform" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "karate-management-%{+YYYY.MM.dd}"
    document_type => "_doc"
    action => "index"
    user => "elastic"
    password => "changeme"
  }
  stdout { codec => rubydebug }
} 