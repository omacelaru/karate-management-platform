version: '3.8'

services:
  # PostgreSQL 13
  postgres:
    image: postgres:13
    container_name: postgres-DB
    environment:
      POSTGRES_USER: karate_user
      POSTGRES_PASSWORD: Karate.user2025
      POSTGRES_DB: karate_users_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.1
    container_name: logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - ./src/main/resources/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./src/main/resources/logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - app-network
    depends_on:
      - elasticsearch

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - app-network
    depends_on:
      - elasticsearch

  # SonarQube
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonarqube
      - SONAR_JDBC_USERNAME=karate_user
      - SONAR_JDBC_PASSWORD=Karate.user2025
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - postgres
    networks:
      - app-network

  #  # Backend Service (Spring Boot)
  #  karate-management-platform:
  #    build:
  #      context: ./karate-management-platform
  #    container_name: karate-management-platform
  #    depends_on:
  #      - postgres
  #    environment:
  #      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/karate_users_db
  #      SPRING_DATASOURCE_USERNAME: karate_user
  #      SPRING_DATASOURCE_PASSWORD: Karate.user2025
  #      FRONTEND_URL: http://localhost:3000
  #    ports:
  #      - "8080:8080"
  #    networks:
  #      - app-network

  #  # Frontend Service (Next.js)
  #  karate-management-frontend:
  #    build:
  #      context: ./karate-management-frontend
  #    container_name: karate-management-frontend
  #    ports:
  #      - "3000:3000"
  #    environment:
  #      - NEXT_PUBLIC_API_URL=http://karate-management-platform:8080
  #      - NODE_ENV=development
  #      - NEXTAUTH_SECRET=your-super-secret-key-here
  #      - NEXTAUTH_URL=http://localhost:3000
  #    depends_on:
  #      - karate-management-platform
  #    networks:
  #      - app-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./src/main/resources/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - app-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - app-network

  # AlertManager
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./src/main/resources/alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  app-network:
    driver: bridge